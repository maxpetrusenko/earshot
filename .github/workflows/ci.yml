name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Self-hosted on vps-builder (GitHub-hosted runners are blocked by billing).
    # Fork PRs never reach the runner: only pushes and same-repo PRs run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, vps-builder]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
